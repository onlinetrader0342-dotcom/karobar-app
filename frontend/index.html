<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07a5c2">
<title>Karobar — Shop Accounting</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/icon.svg">
</head>
<body>
<div id="auth-screen" style="display:none">
  <div class="auth-wrap">
    <div class="auth-card">
      <img class="logo" src="/static/icon.svg" alt="Karobar">
      <h2 style="margin:8px 0 2px">Karobar</h2>
      <div style="color:#6b7280;font-size:13px">Shop accounting — billing, stock, ledger</div>
      <div class="tabs">
        <button id="tab-login" class="active" onclick="showAuthTab('login')">Login</button>
        <button id="tab-signup" onclick="showAuthTab('signup')">New Account</button>
      </div>
      <div id="auth-login">
        <label class="f" style="text-align:left">Mobile Number</label>
        <input id="login-phone" inputmode="tel" placeholder="03xxxxxxxxx">
        <label class="f" style="text-align:left">Password</label>
        <input id="login-pass" type="password" placeholder="Password">
      </div>
      <div id="auth-signup" style="display:none">
        <label class="f" style="text-align:left">Shop Name</label>
        <input id="su-shop" placeholder="E.g. Imran Electric Store">
        <label class="f" style="text-align:left">Your Name</label>
        <input id="su-owner" placeholder="Your name">
        <label class="f" style="text-align:left">Mobile Number</label>
        <input id="su-phone" inputmode="tel" placeholder="03xxxxxxxxx">
        <label class="f" style="text-align:left">Password</label>
        <input id="su-pass" type="password" placeholder="At least 4 characters">
      </div>
      <div class="err" id="auth-err"></div>
      <button class="btn primary block" onclick="doAuth()">Login</button>
      <div style="font-size:12px;color:#6b7280;margin-top:12px">Demo: 03219807144 / demo1234</div>
    </div>
  </div>
</div>

<div id="app-screen" style="display:none">
  <header class="topbar">
    <button class="hamb" onclick="openDrawer()" aria-label="Menu"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18"/><path d="M3 12h18"/><path d="M3 18h18"/></svg></button>
    <h1>Karobar</h1>
    <span class="top-sp"></span>
  </header>
  <div id="drawer-bg" class="drawer-bg" onclick="closeDrawer()"></div>
  <aside id="drawer" class="drawer">
    <div class="drawer-head">
      <img class="logo" src="/static/icon.svg" alt="">
      <div><div class="t">Karobar</div><div class="s" id="drawer-shop">—</div></div>
    </div>
    <div id="drawer-menu"></div>
  </aside>

  <section class="view" id="v-home"></section>
  <section class="view" id="v-sale"></section>
  <section class="view" id="v-bill-detail"></section>
  <section class="view" id="v-est-detail"></section>
  <section class="view" id="v-kharid"></section>
  <section class="view" id="v-kharid-detail"></section>
  <section class="view" id="v-stock"></section>
  <section class="view" id="v-khata"></section>
  <section class="view" id="v-party"></section>
  <section class="view" id="v-more"></section>
  <section class="view" id="v-challans"></section>
  <section class="view" id="v-challan-detail"></section>
  <section class="view" id="v-banks"></section>
  <section class="view" id="v-bank-detail"></section>
  <section class="view" id="v-reminders"></section>
  <section class="view" id="v-cash"></section>
  <section class="view" id="v-kharchay"></section>
  <section class="view" id="v-reports"></section>
  <section class="view" id="v-settings"></section>

  <nav class="bottom" id="bottom-nav">
    <button data-v="v-home" class="active" onclick="go('v-home')"><span class="ic"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg></span>Home</button>
    <button data-v="v-sale" onclick="go('v-sale')"><span class="ic"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1z"/><path d="M8 7h8"/><path d="M8 11h8"/><path d="M8 15h5"/></svg></span>Sale</button>
    <button data-v="v-kharid" onclick="go('v-kharid')"><span class="ic"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></span>Purchases</button>
    <button data-v="v-stock" onclick="go('v-stock')"><span class="ic"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96L12 12.01l8.73-5.05"/><path d="M12 22.08V12"/></svg></span>Stock</button>
    <button data-v="v-more" onclick="go('v-more')"><span class="ic"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.7" fill="currentColor" stroke="none"/></svg></span>More</button>
  </nav>
</div>

<div id="modal-root"></div>
<script src="/static/app.js"></script>
</body>
</html>
